name: Keep scheduled workflows active

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%d' > .github/keepalive
          git add .github/keepalive
          if git diff --cached --quiet -- .github/keepalive; then
            echo "Keepalive date is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${GITHUB_REF_NAME}"
