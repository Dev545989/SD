name: DKSA

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-clean:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        category:
          - vehicles
          - mobile-phones-accessories
          - electronics-home-appliances
          - home-garden
          - fashion-beauty
          - pets
          - kids-babies
          - sporting-goods-bikes
          - hobbies-music-art-books
          - jobs-services
          - business-industrial

    steps:
      - uses: actions/checkout@v4

      # Get workflow start time from GitHub API (accurate)
      - name: Get workflow start time
        id: workflow_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT (timestamp: $START_TIMESTAMP)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Scrape ${{ matrix.category }}
        env:
          AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
        run: python main.py --category ${{ matrix.category }} --out-dir data

      - name: Clean & upload to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_GLOBAL_START: ${{ steps.workflow_start.outputs.start_time }}
        run: python clean_and_upload.py data/${{ matrix.category }}.csv --date "$(date -u -d 'yesterday' +%Y-%m-%d)"