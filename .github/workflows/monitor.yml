      # ✅ خطوة جديدة: طباعة جميع المسارات في R2
      - name: Debug - Print all R2 paths
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import boto3
          import os
          from datetime import datetime

          def print_all_r2_paths(client, bucket, base_prefix="DKSA", date_str=None):
              """Print all R2 paths for debugging."""
              if date_str:
                  year, month, day = date_str.split("-")
                  prefix = f"{base_prefix}/year={year}/month={month}/day={day}/"
              else:
                  prefix = f"{base_prefix}/"
              
              print("=" * 70)
              print(f"📂 SCANNING R2 PATHS: {prefix}")
              print("=" * 70)
              
              try:
                  paginator = client.get_paginator("list_objects_v2")
                  folders = set()
                  all_keys = []
                  
                  for page in paginator.paginate(Bucket=bucket, Prefix=prefix, Delimiter='/'):
                      for common_prefix in page.get('CommonPrefixes', []):
                          folders.add(common_prefix['Prefix'])
                      for obj in page.get('Contents', []):
                          key = obj['Key']
                          if not key.endswith('/'):
                              all_keys.append({'key': key, 'size': obj['Size']})
                  
                  print(f"\n📁 FOLDERS ({len(folders)}):")
                  for folder in sorted(folders):
                      print(f"   📂 {folder}")
                  
                  # Also show files at root level
                  excel_files = [k for k in all_keys if k['key'].endswith('.xlsx')]
                  json_files = [k for k in all_keys if k['key'].endswith('.json')]
                  
                  print(f"\n📄 FILES at root level:")
                  print(f"   Excel files: {len(excel_files)}")
                  print(f"   JSON files: {len(json_files)}")
                  
                  # Show sample of Excel files
                  if excel_files:
                      print(f"\n   Sample Excel files:")
                      for item in sorted(excel_files, key=lambda x: x['key'])[:10]:
                          size_kb = round(item['size'] / 1024, 1)
                          print(f"      📄 {item['key']} ({size_kb} KB)")
                      if len(excel_files) > 10:
                          print(f"      ... and {len(excel_files) - 10} more")
                  
                  # Show sample of JSON files
                  if json_files:
                      print(f"\n   Sample JSON files:")
                      for item in sorted(json_files, key=lambda x: x['key'])[:10]:
                          size_kb = round(item['size'] / 1024, 1)
                          print(f"      📄 {item['key']} ({size_kb} KB)")
                      if len(json_files) > 10:
                          print(f"      ... and {len(json_files) - 10} more")
                  
                  # Deep scan for Excel files
                  print("\n" + "=" * 70)
                  print("🔍 DEEP SCAN (Excel files only):")
                  print("=" * 70)
                  
                  # Scan recursively for Excel files
                  def scan_excel(prefix_inner, depth=0, max_depth=5):
                      if depth > max_depth:
                          return
                      indent = "  " * depth
                      try:
                          paginator2 = client.get_paginator("list_objects_v2")
                          folders = []
                          excel_found = []
                          for page in paginator2.paginate(Bucket=bucket, Prefix=prefix_inner, Delimiter='/'):
                              for common_prefix in page.get('CommonPrefixes', []):
                                  folders.append(common_prefix['Prefix'])
                              for obj in page.get('Contents', []):
                                  key = obj['Key']
                                  if key.endswith('.xlsx') and not key.endswith('/'):
                                      excel_found.append(key)
                          
                          if excel_found:
                              print(f"{indent}📂 {prefix_inner} → {len(excel_found)} Excel files")
                              for f in excel_found[:5]:
                                  print(f"{indent}   📄 {f}")
                              if len(excel_found) > 5:
                                  print(f"{indent}   ... and {len(excel_found) - 5} more")
                          
                          for folder in folders[:10]:
                              scan_excel(folder, depth + 1, max_depth)
                      except Exception as e:
                          pass
                  
                  scan_excel(prefix)
                  
              except Exception as e:
                  print(f"❌ Error scanning R2: {e}")

          # Run the function
          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']
          
          # Check both dates
          print("\n" + "=" * 70)
          print("📅 CHECKING 2026-08-02")
          print("=" * 70)
          print_all_r2_paths(client, bucket, "DKSA", "2026-08-02")
          
          print("\n" + "=" * 70)
          print("📅 CHECKING 2026-08-03")
          print("=" * 70)
          print_all_r2_paths(client, bucket, "DKSA", "2026-08-03")
          
          EOF

