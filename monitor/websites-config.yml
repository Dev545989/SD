# ============================================================
# ALERT THRESHS — schema validation + historical trend alarms
# Trend multipliers calibrated against monitor_stats.yml
# (observed 2026-06-07 → 2026-06-13, 7 days, 23 scrapers)
# ============================================================
alert_thresholds:
  enabled: true

  # Fire webhook when ANY scraper fails schema / trend / missing-files check
  alert_on_any_failure: true

  # Historical trend checks (requires monitor_stats.yml in R2)
  trend:
    min_observed_days: 3
    min_row_pct_of_hist_min: 30       # alert if rows < 30% of historical min per sheet
    max_row_pct_of_hist_max: 300      # alert if rows > 300% of historical max per sheet
    min_file_size_pct_of_hist_min: 50 # alert if file < 50% of historical min per scraper

  # Run-level gate — skip webhook if failure rate is below this (0 = always alert)
  max_scraper_fail_rate_pct: 0

  # Per-scraper observed file-size floors (KB) from real stats × 50%, floored at schema min
  # Used as a fast check even before trend history exists
  observed_min_file_size_kb: 
    cars-for-sale: 5
    cars-for-rent: 5
    car-accessories: 5
    motorcycles: 5
    boats: 5
    trucks: 5
    other-vehicles: 5
    spare-parts: 5
    vip-car-plates: 5
    mobile-phones-accessories: 5
    electronics-home-appliances: 5
    home-garden: 5
    fashion-beauty: 5
    pets: 5
    kids-babies: 5 
    sporting-goods-bikes: 5
    hobbies-music-art-books: 5
    jobs-services: 5
    Business & Industrial: 5
    motors: 5

  channels:
    webhook:
      enabled: true
      # URL from env MONITOR_ALERT_WEBHOOK_URL (GitHub secret)
      # Import monitor/n8n-email-alert-workflow.json for email via n8n
