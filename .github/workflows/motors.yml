name: DKSA Motors

on:
  workflow_run:
    workflows: ["DKSA"]
    types:
      - completed
  workflow_dispatch:

jobs:
  scrape_list:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape listing pages
        run: python main_motors.py --mode list

      - name: Upload car list
        uses: actions/upload-artifact@v4
        with:
          name: new-cars-list
          path: new_cars.csv

  detect_detail_jobs:
    runs-on: ubuntu-latest
    needs: scrape_list
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Download car list
        uses: actions/download-artifact@v4
        with:
          name: new-cars-list

      - name: Build detail-job matrix
        id: build_matrix
        run: |
          python << 'EOF'
          import json
          import os
          import pandas as pd

          # ~3-6s per car (retries aside) -> a chunk of 300 cars is
          # roughly 20-30 minutes, comfortably clear of the 6h job limit
          # even accounting for retries/slow responses.
          CHUNK_SIZE = 300

          df = pd.read_csv("new_cars.csv")
          n = len(df)
          print(f"Total cars: {n}")

          matrix = {"include": []}
          for i in range(0, n, CHUNK_SIZE):
              start = i
              end = min(i + CHUNK_SIZE, n)
              matrix["include"].append({"start": start, "end": end})

          print(f"Total detail jobs: {len(matrix['include'])}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  scrape_details:
    runs-on: ubuntu-latest
    needs: detect_detail_jobs
    strategy:
      matrix: ${{ fromJson(needs.detect_detail_jobs.outputs.matrix) }}
      max-parallel: 15
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download car list
        uses: actions/download-artifact@v4
        with:
          name: new-cars-list

      - name: Scrape car details [${{ matrix.start }}:${{ matrix.end }}]
        run: python main_motors.py --mode details --start ${{ matrix.start }} --end ${{ matrix.end }}

      - name: Upload chunk results
        uses: actions/upload-artifact@v4
        with:
          name: details-${{ matrix.start }}-${{ matrix.end }}
          path: |
            car_details_${{ matrix.start }}_${{ matrix.end }}.csv
            failed_urls_motors_${{ matrix.start }}_${{ matrix.end }}.json
            request_stats_motors_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore

  merge_and_clean:
    runs-on: ubuntu-latest
    needs: scrape_details
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all detail chunks
        uses: actions/download-artifact@v4
        with:
          pattern: details-*
          merge-multiple: true
          path: details_parts/

      - name: Merge chunks into the files motors_cleaning.py expects
        run: |
          python merge_car_details.py \
            --details-dir details_parts \
            --output-csv all_motors_cars.csv \
            --failed-output failed_urls_motors.json \
            --stats-output request_stats_motors.json

      - name: Clean & upload to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python motors_cleaning.py all_motors_cars.csv