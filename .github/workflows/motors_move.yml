name: Move Motors Summary

on:
  workflow_dispatch:

jobs:
  move-motors-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install boto3

      - name: Move Motors summary into motors
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}

        run: |
          python - <<'PY'
          import os
          import boto3

          # ============================================================
          # R2 Configuration
          # ============================================================

          endpoint_url = os.environ["CF_R2_ENDPOINT_URL"]
          access_key = os.environ["CF_R2_ACCESS_KEY_ID"]
          secret_key = os.environ["CF_R2_SECRET_ACCESS_KEY"]
          bucket = os.environ["CF_R2_BUCKET_NAME"]

          if not endpoint_url:
              raise ValueError("CF_R2_ENDPOINT_URL is empty")

          if not access_key:
              raise ValueError("CF_R2_ACCESS_KEY_ID is empty")

          if not secret_key:
              raise ValueError("CF_R2_SECRET_ACCESS_KEY is empty")

          if not bucket:
              raise ValueError("CF_R2_BUCKET_NAME is empty")

          print("=" * 70)
          print("R2 Configuration")
          print("=" * 70)
          print(f"Endpoint: {endpoint_url}")
          print(f"Bucket:   {bucket}")
          print("=" * 70)

          # ============================================================
          # R2 Client
          # ============================================================

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint_url,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
          )

          # ============================================================
          # Paths
          # ============================================================

          old_prefix = (
              "DKSA/year=2026/month=08/day=11/"
              "Motors/summary/"
          )

          new_prefix = (
              "DKSA/year=2026/month=08/day=11/"
              "motors/summary/"
          )

          print()
          print("=" * 70)
          print("Moving Motors summary")
          print("=" * 70)
          print(f"FROM: {old_prefix}")
          print(f"TO:   {new_prefix}")
          print("=" * 70)

          # ============================================================
          # Find objects under Motors/summary/
          # ============================================================

          paginator = s3.get_paginator("list_objects_v2")

          objects = []

          for page in paginator.paginate(
              Bucket=bucket,
              Prefix=old_prefix
          ):
              objects.extend(page.get("Contents", []))

          if not objects:
              print()
              print("❌ No objects found under:")
              print(old_prefix)
              exit(0)

          print()
          print(f"📦 Found {len(objects)} object(s)")
          print()

          # ============================================================
          # Copy then delete
          # ============================================================

          moved = 0

          for obj in objects:
              old_key = obj["Key"]

              # Get everything after Motors/summary/
              relative_path = old_key[len(old_prefix):]

              new_key = new_prefix + relative_path

              print(f"📄 {old_key}")
              print(f"   → {new_key}")

              # --------------------------------------------------------
              # Copy
              # --------------------------------------------------------

              s3.copy_object(
                  Bucket=bucket,
                  CopySource={
                      "Bucket": bucket,
                      "Key": old_key,
                  },
                  Key=new_key,
              )

              print("   ✅ Copied")

              # --------------------------------------------------------
              # Delete old object
              # --------------------------------------------------------

              s3.delete_object(
                  Bucket=bucket,
                  Key=old_key,
              )

              print("   🗑️ Deleted old object")
              print()

              moved += 1

          # ============================================================
          # Done
          # ============================================================

          print("=" * 70)
          print(f"✅ Successfully moved {moved} object(s)")
          print("=" * 70)