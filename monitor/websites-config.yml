# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch DKSA → DKSA Motors → DKSA Monitor (daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "DKSA"
    trigger: "cron: '0 0 * * *'"
    triggers_next: null

